<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="contact-us">
        <form action="">
            <input type="text" placeholder="please enter your name"><br>
            <input type="tel" placeholder="please enter your phone number"><br>
            <input type="email" placeholder="please enter your email"><br>
            <select placeholder="what is your gender"><br>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
